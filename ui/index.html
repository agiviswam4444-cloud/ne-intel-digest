<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NE India Security Intelligence Digest</title>
<link rel="stylesheet" href="/vendor/leaflet.css">
<script src="/vendor/leaflet.js"></script>
<style>
:root{
  --bg:#0d1117; --surface:#161b22; --surface2:#1c2128; --border:#30363d;
  --accent:#e36209; --accent2:#1f6feb; --red:#f85149; --green:#3fb950;
  --yellow:#d29922; --muted:#8b949e; --text:#e6edf3; --subtext:#c9d1d9;
  --crit:#f85149; --high:#e36209; --med:#d29922; --low:#8b949e;
}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--text);
  font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
header{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;
  padding:18px 26px 12px;border-bottom:1px solid var(--border)}
header h1{font-size:17px;font-weight:700;letter-spacing:.4px}
header h1 span{color:var(--accent)}
#window-banner{color:var(--muted);font-size:12.5px}
#controls{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
select,button,input{background:var(--surface2);color:var(--text);border:1px solid var(--border);
  border-radius:6px;padding:6px 12px;font-size:13px}
button{cursor:pointer}
input#search{min-width:230px}
input#search::placeholder{color:var(--muted)}
button.primary{background:var(--accent);border-color:var(--accent);color:#0d1117;font-weight:600}
button:disabled{opacity:.5;cursor:wait}
nav{display:flex;gap:2px;padding:0 26px;border-bottom:1px solid var(--border);
  overflow-x:auto}
nav a{padding:10px 14px;color:var(--muted);text-decoration:none;font-size:13.5px;
  border-bottom:2px solid transparent;white-space:nowrap;cursor:pointer}
nav a.active{color:var(--text);border-bottom-color:var(--accent)}
nav a:focus-visible{outline:2px solid var(--accent2);outline-offset:-2px}
main{padding:20px 26px;max-width:1280px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:8px;
  padding:14px 16px;margin-bottom:14px}

/* ---- Console: region columns ---- */
.columns{display:flex;gap:12px;overflow-x:auto;padding-bottom:8px}
.col{flex:0 0 300px;min-width:300px;background:var(--surface);border:1px solid var(--border);
  border-radius:8px;display:flex;flex-direction:column;max-height:calc(100vh - 200px)}
.col-head{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--border);
  position:sticky;top:0;background:var(--surface);border-radius:8px 8px 0 0}
.col-head b{font-size:13px;text-transform:uppercase;letter-spacing:.8px}
.col-head .n{margin-left:auto;font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--muted)}
.col-body{overflow-y:auto;padding:8px}
.col.empty-col{opacity:.5}
.icard{display:flex;gap:10px;padding:9px;border-radius:7px;border:1px solid var(--surface2);
  margin-bottom:8px;background:var(--bg)}
.icard:last-child{margin-bottom:0}
.icard .thumb{flex:0 0 54px;width:54px;height:54px;border-radius:5px;object-fit:cover;background:var(--surface2)}
.icard .ibody{flex:1;min-width:0}
.icard .imeta{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:3px}
.icard a.isum{color:var(--text);text-decoration:none;font-size:13.5px;font-weight:500;display:block}
.icard a.isum:hover{color:var(--accent2);text-decoration:underline}
.icard .its{color:var(--muted);font-size:11px;margin-top:3px;display:block}
.sev{font-family:ui-monospace,Menlo,monospace;font-size:10px;font-weight:700;padding:1px 6px;
  border-radius:9px;letter-spacing:.4px}
.sev-CRITICAL{color:#fff;background:var(--crit)}
.sev-HIGH{color:#fff;background:var(--high)}
.sev-MEDIUM{color:#0d1117;background:var(--med)}
.sev-LOW{color:var(--muted);border:1px solid var(--border)}
.crit-badge{font-family:ui-monospace,Menlo,monospace;font-size:10px;color:var(--crit);
  border:1px solid var(--crit);border-radius:9px;padding:1px 6px}

/* ---- generic story rows (list tabs) ---- */
.story{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;
  padding:9px 4px;border-bottom:1px solid var(--surface2)}
.story:last-child{border-bottom:none}
.story a.head{color:var(--text);text-decoration:none;font-weight:500;flex:1;min-width:260px}
.story a.head:hover{color:var(--accent2);text-decoration:underline}
.badge{font-family:ui-monospace,Menlo,monospace;font-size:11px;padding:2px 7px;
  border-radius:10px;border:1px solid var(--border);color:var(--subtext);
  background:var(--surface2);white-space:nowrap}
.badge.x{color:#fff;background:var(--accent2);border-color:var(--accent2)}
.badge.v-rss{color:var(--green);border-color:var(--green)}
.badge.v-xapi{color:var(--accent2);border-color:var(--accent2)}
.badge.v-p1{color:var(--yellow);border-color:var(--yellow)}
.badge.v-p2{color:var(--accent);border-color:var(--accent)}
.ts{color:var(--muted);font-size:12px;white-space:nowrap}
h2{font-size:13px;text-transform:uppercase;letter-spacing:1.2px;color:var(--muted);
  margin:22px 0 8px}
h2 .n{color:var(--accent);font-family:ui-monospace,Menlo,monospace;margin-right:6px}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:12px 14px}
.stat b{display:block;font-size:22px;font-family:ui-monospace,Menlo,monospace}
.stat span{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:6px 10px;border-bottom:1px solid var(--surface2)}
th{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.8px}
td.mono{font-size:12px}
.ok{color:var(--green)}.thin{color:var(--yellow)}.zero{color:var(--red)}
details{margin-bottom:8px}
summary{cursor:pointer;padding:8px 4px;color:var(--subtext);font-weight:600}
.empty{color:var(--muted);padding:30px 4px;text-align:center}
#runmsg{font-size:12px;color:var(--yellow)}

/* ---- Map ---- */
.mapscope{display:flex;gap:6px;margin-bottom:10px}
.mapscope button{font-size:12.5px;padding:5px 12px}
.mapscope button.on{background:var(--accent2);border-color:var(--accent2);color:#fff}
#mapstats{color:var(--muted);font-size:12.5px;margin-bottom:8px}
#map{height:calc(100vh - 220px);min-height:420px;border:1px solid var(--border);
  border-radius:8px;background:#0b0f14}
.leaflet-container{background:#0b0f14}
.leaflet-popup-content-wrapper{background:var(--surface);color:var(--text);border:1px solid var(--border)}
.leaflet-popup-tip{background:var(--surface);border:1px solid var(--border)}
.leaflet-popup-content{margin:10px 12px;font:13px/1.4 -apple-system,Segoe UI,sans-serif}
.ppop .ptitle{font-weight:700;font-size:13px;margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid var(--border)}
.ppop .pstate{color:var(--muted);font-family:ui-monospace,Menlo,monospace;font-size:11px}
.pincident{margin-bottom:9px}
.pincident:last-child{margin-bottom:0}
.pincident a{color:var(--text);text-decoration:none;display:block;margin-top:2px}
.pincident a:hover{color:var(--accent2);text-decoration:underline}
.pincident .pmeta{color:var(--muted);font-size:11px;margin-top:2px}
.maplegend{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;font-size:12px;color:var(--muted)}
.maplegend .dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:middle}
@media (max-width:640px){main,header,nav{padding-left:14px;padding-right:14px}}
</style>
</head>
<body>
<header>
  <h1>NE INDIA <span>//</span> SECURITY INTEL DIGEST</h1>
  <div id="window-banner" class="mono"></div>
  <div id="controls">
    <input id="search" type="search" placeholder="Filter news… (multi-word)" aria-label="Filter">
    <span id="runmsg"></span>
    <select id="dateSel" aria-label="Digest date"></select>
    <button class="primary" id="runBtn">Run now</button>
  </div>
</header>
<nav id="tabs">
  <a data-tab="console" class="active">Console</a>
  <a data-tab="map">Map</a>
  <a data-tab="actors">Actors</a>
  <a data-tab="stories">All Stories</a>
  <a data-tab="sections">By Section</a>
  <a data-tab="sources">Source Status</a>
  <a data-tab="audit">Audit</a>
  <a data-tab="archive">Archive</a>
</nav>
<main id="content"><div class="empty">Loading…</div></main>

<script>
const $=s=>document.querySelector(s);
const $$=s=>document.querySelectorAll(s);
const STATE_ORDER=["MN","AS","NL","MZ","ML","AR","TR","SK","MULTI","DEF","CN","BD","MM"];
const STATE_NAME={AS:"Assam",MN:"Manipur",NL:"Nagaland",MZ:"Mizoram",ML:"Meghalaya",
  AR:"Arunachal",TR:"Tripura",SK:"Sikkim",MULTI:"Multi / Border",
  DEF:"🛡 Defence",CN:"🇨🇳 China",BD:"🇧🇩 Bangladesh",MM:"🇲🇲 Myanmar"};
// Defence + neighbourhood-watch columns are defence-filtered and set apart.
const FOREIGN=new Set(["DEF","CN","BD","MM"]);
const SEVCOL={CRITICAL:"#f85149",HIGH:"#e36209",MEDIUM:"#d29922",LOW:"#8b949e"};
let D=null, tab="console", query="", mapObj=null, mapScope="all";

const esc=t=>(t||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const prevDay=d=>{const [y,m,dd]=d.split("-").map(Number);const x=new Date(Date.UTC(y,m-1,dd));x.setUTCDate(x.getUTCDate()-1);return x.toISOString().slice(0,10)};
const VB={"rss-pubdate":["v-rss","RSS"],"feed-date":["v-rss","RSS"],
  "x-api":["v-xapi","𝕏"],"crawl":["v-p1","CRAWL"],"screenshot":["v-p2","SHOT"]};
const vb=s=>{const e=VB[s.date_source];return e?`<span class="badge ${e[0]}">${e[1]}</span>`:"";};
const outletB=s=>s.outlet&&s.outlet.startsWith("X / ")
  ?`<span class="badge x">𝕏 ${esc(s.outlet.slice(4))}</span>`
  :(s.outlet?`<span class="badge">${esc(s.outlet)}</span>`:"");
const sevB=s=>s.severity?`<span class="sev sev-${s.severity}">${s.severity}</span>`:"";
const tstamp=s=>`${s.pub_date||"—"}${s.pub_time_ist&&s.pub_time_ist!=="unknown"?" · "+s.pub_time_ist+" IST":""}`;

// list-tab row: severity + summary(link) + date + light metadata
const storyRow=s=>`<div class="story">
  ${sevB(s)}
  <a class="head" href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.summary||s.headline||"")}</a>
  <span class="ts mono">${tstamp(s)}</span>
  ${outletB(s)}${s.state?`<span class="badge">${s.state}</span>`:""}${vb(s)}</div>`;

// console card: thumbnail + severity + summary(link) + meta
const iCard=s=>`<div class="icard">
  ${s.image_url?`<img class="thumb" src="${esc(s.image_url)}" loading="lazy" onerror="this.style.display='none'">`:""}
  <div class="ibody">
    <div class="imeta">${sevB(s)}${outletB(s)}</div>
    <a class="isum" href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.summary||s.headline||"")}</a>
    <span class="its mono">${tstamp(s)}</span>
  </div></div>`;

const matches=s=>{
  if(!query)return true;
  const hay=((s.headline||"")+" "+(s.summary||"")+" "+(s.outlet||"")).toLowerCase();
  return query.toLowerCase().split(/\s+/).filter(Boolean).every(w=>hay.includes(w));
};

function banner(){
  const upd=new Date().toLocaleTimeString("en-IN",{hour:"2-digit",minute:"2-digit"});
  const iv=D&&D.auto_refresh_minutes?` · auto-refresh ${D.auto_refresh_minutes}m`:"";
  const busy=D&&D.collecting?" · collecting new news…":"";
  $("#window-banner").textContent=D&&D.date
    ?`Covering: ${prevDay(D.date)} + ${D.date}  ·  updated ${upd}${iv}${busy}`
    :"No runs yet — press Run now";
}

async function load(date){
  D=await (await fetch("/api/digest"+(date?`?date=${date}`:""))).json();
  const dates=await (await fetch("/api/dates")).json();
  const cur=date||D.date;
  $("#dateSel").innerHTML=dates.map(d=>`<option ${d===cur?"selected":""}>${d}</option>`).join("");
  banner();
  render();
}

// Auto-refresh: silently re-pull the digest so newly collected stories appear
// on top. Skips a re-render on Map/Archive so it doesn't reset the map view.
async function poll(){
  try{
    const nd=$("#dateSel").value||"";
    const fresh=await (await fetch("/api/digest"+(nd?`?date=${nd}`:""))).json();
    if(fresh&&fresh.stories){D=fresh;banner();if(tab!=="map"&&tab!=="archive")render();}
  }catch(e){}
}
setInterval(poll,60000);

function render(){
  const c=$("#content");
  if(!D||!D.stories){c.innerHTML='<div class="empty">No data.</div>';return}
  if(tab==="console")c.innerHTML=consoleView();
  else if(tab==="map")renderMap();
  else if(tab==="actors")renderActors();
  else if(tab==="stories")c.innerHTML=allStories();
  else if(tab==="sections")c.innerHTML=bySection();
  else if(tab==="sources")c.innerHTML=sources();
  else if(tab==="audit")c.innerHTML=audit();
  else if(tab==="archive")archive();
}

const tkey=s=>(s.pub_date||"")+" "+(s.pub_time_ist||"");
function consoleView(){
  const rows=D.stories.filter(matches);
  const cols=STATE_ORDER.map(st=>{
    let list=rows.filter(s=>s.state===st);
    list.sort((a,b)=>tkey(b).localeCompare(tkey(a)));   // newest news on top
    const crit=list.filter(s=>s.severity==="CRITICAL").length;
    return `<div class="col ${list.length?"":"empty-col"}"${FOREIGN.has(st)?' style="border-color:var(--accent2)"':""}>
      <div class="col-head"><b style="color:${list.length?"var(--text)":"var(--muted)"}">${STATE_NAME[st]}</b>
        ${crit?`<span class="crit-badge">${crit} CRIT</span>`:""}
        <span class="n">${list.length}</span></div>
      <div class="col-body">${list.length?list.map(iCard).join(""):'<div class="empty" style="padding:16px">—</div>'}</div>
    </div>`;
  }).join("");
  return `<div class="columns">${cols}</div>`;
}

function allStories(){
  const rows=D.stories.filter(matches);
  return `<div class="card">${rows.length?rows.map(storyRow).join(""):'<div class="empty">No stories match.</div>'}</div>`;
}

function bySection(){
  const rows=D.stories.filter(matches);
  return Object.entries(D.sections||{}).map(([n,name])=>{
    const list=rows.filter(s=>String(s.section)===String(n));
    if(!list.length)return"";
    return`<h2><span class="n">${String(n).padStart(2,"0")}</span>${esc(name)}</h2>
      <div class="card">${list.map(storyRow).join("")}</div>`;
  }).join("")||'<div class="empty">No stories.</div>';
}

function sources(){
  return `<div class="card"><table><tr><th>Source</th><th>Step</th><th>Status</th><th>Candidates</th></tr>
  ${(D.sources||[]).map(s=>`<tr><td class="mono">${esc(s.source)}</td><td class="mono">${s.step}</td>
    <td class="mono ${s.status.startsWith("ok")?"ok":"zero"}">${esc(s.status)}</td>
    <td class="mono">${s.candidates}</td></tr>`).join("")}</table></div>`;
}

function audit(){
  const a=D.audit||{};
  return `<div class="card"><table><tr><th>Metric</th><th>Value</th></tr>
  ${Object.entries(a).map(([k,v])=>`<tr><td class="mono">${k}</td><td class="mono">${typeof v==="object"?esc(JSON.stringify(v)):v}</td></tr>`).join("")}
  </table></div>
  <h2>Excluded (${(D.excluded||[]).length})</h2>
  <div class="card"><table><tr><th>URL</th><th>Reason</th></tr>
  ${(D.excluded||[]).map(e=>`<tr><td class="mono" style="max-width:600px;overflow:hidden;text-overflow:ellipsis">
    <a href="${esc(e.url)}" target="_blank" rel="noopener" style="color:var(--muted)">${esc(e.url)}</a></td>
    <td class="mono">${esc(e.reason)}</td></tr>`).join("")||'<tr><td colspan=2 class="empty">None</td></tr>'}
  </table></div>`;
}

async function archive(){
  const arc=await (await fetch("/api/archive")).json();
  $("#content").innerHTML=arc.map(d=>`<details ${d.date===D.date?"open":""}>
    <summary class="mono">${d.date} — ${d.stories.length} stories</summary>
    <div class="card">${d.stories.map(storyRow).join("")||'<div class="empty">Empty</div>'}</div>
  </details>`).join("")||'<div class="empty">No archive yet.</div>';
}

// ---------- Map (offline Leaflet + GeoJSON basemap) ----------
function popupHtml(p){
  const rows=p.incidents.map(i=>`<div class="pincident">
    <span class="sev sev-${i.severity}">${i.severity}</span>
    <a href="${esc(i.url)}" target="_blank" rel="noopener">${esc(i.summary||i.headline)}</a>
    <div class="pmeta mono">${i.pub_date}${i.pub_time_ist&&i.pub_time_ist!=="unknown"?" · "+i.pub_time_ist:""}${i.outlet?" · "+esc(i.outlet):""}</div>
  </div>`).join("");
  return `<div class="ppop"><div class="ptitle">${esc(p.place)} <span class="pstate">${p.state}</span> · ${p.incidents.length} incident${p.incidents.length>1?"s":""}</div>${rows}</div>`;
}

// ---- Area-of-interest state (radius search) ----
let aoi=null;            // {lat,lon,label} centre of the circle
let aoiKm=30, aoiDays=7; // radius + time depth
let circleLayer=null, aoiMarkers=[], baseLayer=null;

function aoiControls(){
  return `
    <div class="mapscope">
      <button data-scope="all" class="${mapScope==="all"?"on":""}">All news</button>
      <button data-scope="security" class="${mapScope==="security"?"on":""}">Security only</button>
      <span style="width:18px"></span>
      <input id="aoiSearch" type="search" placeholder="Search a place (e.g. Moreh)…"
             style="min-width:190px" autocomplete="off">
      <span id="aoiSug" class="ts mono"></span>
    </div>
    <div class="mapscope">
      <span class="ts mono" style="align-self:center">Radius</span>
      ${[10,30,50,100].map(k=>`<button data-km="${k}" class="${aoiKm===k?"on":""}">${k} km</button>`).join("")}
      <span style="width:14px"></span>
      <span class="ts mono" style="align-self:center">Period</span>
      ${[[1,"Today"],[2,"2d"],[7,"7d"],[30,"30d"],[0,"All"]].map(([d,l])=>
        `<button data-days="${d}" class="${aoiDays===d?"on":""}">${l}</button>`).join("")}
      ${aoi?`<button id="aoiClear" style="margin-left:auto">✕ Clear circle</button>`:""}
    </div>`;
}

async function renderMap(){
  $("#content").innerHTML=`
    ${aoiControls()}
    <div id="mapstats" class="mono">Loading map…</div>
    <div id="map"></div>
    <div class="maplegend">
      <span><span class="dot" style="background:${SEVCOL.CRITICAL}"></span>Critical</span>
      <span><span class="dot" style="background:${SEVCOL.HIGH}"></span>High</span>
      <span><span class="dot" style="background:${SEVCOL.MEDIUM}"></span>Medium</span>
      <span><span class="dot" style="background:${SEVCOL.LOW}"></span>Low</span>
      <span><b>Click anywhere on the map</b> to drop a circle and see everything inside it.</span>
    </div>
    <div id="aoiList"></div>`;
  wireMapControls();

  const q=`?scope=${mapScope}`+(D.date?`&date=${D.date}`:"");
  const [data, gj] = await Promise.all([
    fetch("/api/map"+q).then(r=>r.json()),
    fetch("/vendor/ne_states.geojson").then(r=>r.json()),
  ]);
  if(!aoi){
    const noun=mapScope==="security"?"security incidents":"stories";
    $("#mapstats").textContent=`${data.located} ${noun} at ${data.points.length} locations — ${data.unlocated} without a recognised place (not shown) · click the map to start an area search`;
  }
  if(mapObj){mapObj.remove();mapObj=null;}
  mapObj=L.map("map",{attributionControl:true,minZoom:4,maxZoom:14});
  // Street-level tiles (online). The bundled GeoJSON outline stays underneath
  // so the map is still readable if the tile server is unreachable.
  baseLayer=L.geoJSON(gj,{style:{color:"#3d4450",weight:1.2,fillColor:"#161b22",fillOpacity:.55}}).addTo(mapObj);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {maxZoom:19, opacity:.55, attribution:"© OpenStreetMap"}).addTo(mapObj);
  mapObj.fitBounds(baseLayer.getBounds(),{padding:[16,16]});

  data.points.forEach(p=>{
    const col=SEVCOL[p.severity]||SEVCOL.LOW;
    L.circleMarker([p.lat,p.lon],{radius:5+Math.min(p.incidents.length*1.6,10),
      color:col,weight:2,fillColor:col,fillOpacity:.55})
     .addTo(mapObj).bindPopup(popupHtml(p),{maxWidth:340});
  });
  // click anywhere -> set the centre of the area of interest
  mapObj.on("click",e=>{ aoi={lat:e.latlng.lat,lon:e.latlng.lng,label:"dropped pin"}; runAoi(); });
  setTimeout(()=>mapObj&&mapObj.invalidateSize(),60);
  if(aoi) runAoi();
}

function wireMapControls(){
  $$(".mapscope [data-scope]").forEach(b=>b.onclick=()=>{mapScope=b.dataset.scope; aoi?runAoi():renderMap();});
  $$(".mapscope [data-km]").forEach(b=>b.onclick=()=>{aoiKm=+b.dataset.km; refreshControls(); if(aoi)runAoi();});
  $$(".mapscope [data-days]").forEach(b=>b.onclick=()=>{aoiDays=+b.dataset.days; refreshControls(); if(aoi)runAoi();});
  const clr=$("#aoiClear");
  if(clr) clr.onclick=()=>{aoi=null; $("#aoiList").innerHTML=""; renderMap();};
  const box=$("#aoiSearch");
  if(box) box.oninput=async()=>{
    const v=box.value.trim();
    if(v.length<3){ $("#aoiSug").textContent=""; return; }
    const r=await (await fetch("/api/geosearch?q="+encodeURIComponent(v))).json();
    const top=(r.results||[]).slice(0,4);
    $("#aoiSug").innerHTML=top.map(x=>
      `<a href="#" data-lat="${x.lat}" data-lon="${x.lon}" data-place="${esc(x.place)}"
          style="color:var(--accent2);margin-right:10px">${esc(x.place)} (${x.state})</a>`).join("");
    $$("#aoiSug a").forEach(a=>a.onclick=ev=>{
      ev.preventDefault();
      aoi={lat:+a.dataset.lat, lon:+a.dataset.lon, label:a.dataset.place};
      if(mapObj) mapObj.setView([aoi.lat,aoi.lon], aoiKm<=10?11:aoiKm<=30?10:9);
      runAoi();
    });
  };
}

function refreshControls(){
  const host=document.querySelector("#content");
  if(!host) return;
  const cur=host.querySelectorAll(".mapscope");
  if(cur.length>=2){
    const tmp=document.createElement("div"); tmp.innerHTML=aoiControls();
    cur[0].replaceWith(tmp.children[0]); cur[cur.length-1].replaceWith(tmp.children[0]);
  }
  wireMapControls();
}

async function runAoi(){
  if(!aoi||!mapObj) return;
  const url=`/api/radius?lat=${aoi.lat}&lon=${aoi.lon}&km=${aoiKm}&days=${aoiDays}&scope=${mapScope}`;
  const d=await (await fetch(url)).json();
  // draw / move the circle
  if(circleLayer) mapObj.removeLayer(circleLayer);
  circleLayer=L.circle([aoi.lat,aoi.lon],{radius:aoiKm*1000,color:"var(--accent)",
    weight:2,fillColor:"#e36209",fillOpacity:.08,dashArray:"5,5"}).addTo(mapObj);
  L.circleMarker([aoi.lat,aoi.lon],{radius:5,color:"#fff",weight:2,
    fillColor:"#e36209",fillOpacity:1}).addTo(circleLayer._map);
  aoiMarkers.forEach(m=>mapObj.removeLayer(m)); aoiMarkers=[];
  d.points.forEach(p=>{
    const col=SEVCOL[p.severity]||SEVCOL.LOW;
    const m=L.circleMarker([p.lat,p.lon],{radius:6+Math.min(p.incidents.length*1.8,12),
      color:col,weight:3,fillColor:col,fillOpacity:.85})
      .addTo(mapObj).bindPopup(popupHtml(p),{maxWidth:360});
    aoiMarkers.push(m);
  });
  const period=aoiDays===0?"whole archive":aoiDays===1?"today":`last ${aoiDays} days`;
  $("#mapstats").innerHTML=`<b>${d.total}</b> ${mapScope==="security"?"security ":""}stor${d.total===1?"y":"ies"} `+
    `at <b>${d.locations}</b> location${d.locations===1?"":"s"} within <b>${aoiKm} km</b> of `+
    `${esc(aoi.label)} · ${period}`;
  $("#aoiList").innerHTML = d.points.length ? `
    <h2>Inside the circle — nearest first</h2>
    ${d.points.map(p=>`<div class="card">
      <div style="display:flex;gap:10px;align-items:baseline">
        <b>${esc(p.place||"—")}</b><span class="badge">${p.state||""}</span>
        <span class="ts mono">${p.distance_km} km away</span>
        <span style="margin-left:auto" class="sev sev-${p.severity}">${p.severity}</span>
      </div>
      ${p.incidents.slice(0,8).map(i=>`<div class="pincident">
        <a href="${esc(i.url)}" target="_blank" rel="noopener">${esc(i.summary||i.headline||"")}</a>
        <div class="pmeta mono">${i.pub_date||""} ${i.pub_time_ist&&i.pub_time_ist!=="unknown"?"· "+i.pub_time_ist:""}
          ${i.outlet?"· "+esc(i.outlet):""}</div></div>`).join("")}
    </div>`).join("")}`
    : `<div class="empty">Nothing located inside this circle. Try a bigger radius or a longer period —
       note only stories naming a recognised place can appear here.</div>`;
}

// ---------- Actors tab (self-contained; touches no other view) ----------
let actorDays=2, actorCat="ALL", actorOpen=null, actorData=null;
const CATCOL={"Armed group":"var(--crit)","Civil society":"var(--accent2)",
  "Security force":"var(--high)","Government / political":"var(--med)",
  "Peace process":"var(--green)"};

function spark(days){
  const ks=Object.keys(days).sort(), vs=ks.map(k=>days[k]);
  if(!vs.length)return"";
  const mx=Math.max(...vs);
  return ks.map(k=>{
    const h=Math.max(2,Math.round(14*days[k]/mx));
    return `<span title="${k}: ${days[k]}" style="display:inline-block;width:6px;height:${h}px;
      background:var(--accent);margin-right:2px;vertical-align:bottom;border-radius:1px"></span>`;
  }).join("");
}

function actorCard(a){
  const col=CATCOL[a.category]||"var(--muted)";
  const st=Object.entries(a.states).slice(0,5)
    .map(([s,n])=>`<span class="badge">${s} ${n}</span>`).join(" ");
  const open=actorOpen===a.key;
  const list=open?`<div style="margin-top:10px;border-top:1px solid var(--border);padding-top:8px">
      ${a.stories.map(s=>`<div class="pincident">
        <a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.summary||s.headline||"")}</a>
        <div class="pmeta mono">${s.pub_date||""} ${s.pub_time_ist&&s.pub_time_ist!=="unknown"?"· "+s.pub_time_ist:""}
          ${s.outlet?"· "+esc(s.outlet):""} ${s.state?"· "+s.state:""}</div></div>`).join("")}
    </div>`:"";
  return `<div class="card" style="border-left:3px solid ${col};cursor:pointer" data-actor="${a.key}">
    <div style="display:flex;align-items:baseline;gap:10px;flex-wrap:wrap">
      <b style="font-size:15px">${esc(a.name)}</b>
      <span class="badge" style="color:${col};border-color:${col}">${esc(a.category)}</span>
      <span style="margin-left:auto;font-family:ui-monospace,Menlo,monospace;font-size:19px">${a.count}</span>
    </div>
    <div style="margin-top:6px;display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap">
      ${st}<span style="margin-left:auto">${spark(a.days)}</span>
    </div>
    <div class="ts mono" style="margin-top:6px">${Object.keys(a.outlets).slice(0,4).map(esc).join(" · ")}</div>
    ${list}</div>`;
}

async function renderActors(){
  const c=$("#content");
  c.innerHTML='<div class="empty">Loading actors…</div>';
  const q=`?days=${actorDays}`+(stateFilterActor&&stateFilterActor!=="ALL"?`&state=${stateFilterActor}`:"");
  try{ actorData=await (await fetch("/api/actors"+q)).json(); }
  catch(e){ c.innerHTML='<div class="empty">Could not load actors.</div>'; return; }
  const D2=actorData;
  const cats=["ALL",...(D2.categories||[])];
  const shown=(D2.actors||[]).filter(a=>actorCat==="ALL"||a.category===actorCat);
  const co=(D2.cooccurrence||[]).length
    ? `<h2>Co-occurrence (actors named in the same story)</h2><div class="card">
        ${D2.cooccurrence.map(x=>`<div class="story"><span class="head">${esc(x.a)} <span style="color:var(--muted)">+</span> ${esc(x.b)}</span>
          <span class="badge">${x.n}</span></div>`).join("")}</div>`
    : `<h2>Co-occurrence</h2><div class="card"><div class="empty" style="padding:14px">
        No repeated actor pairs yet — this fills in as more history accumulates.</div></div>`;
  c.innerHTML=`
    <div class="filterbar">
      ${[1,2,7,30].map(d=>`<button data-days="${d}" class="${actorDays===d?"on":""}">${d===1?"Today":d+" days"}</button>`).join("")}
      <span style="width:14px"></span>
      ${["ALL",...STATE_ORDER.filter(s=>s!=="MULTI")].map(s=>
        `<button data-astate="${s}" class="${(stateFilterActor||"ALL")===s?"on":""}">${s}</button>`).join("")}
    </div>
    <div class="filterbar">
      ${cats.map(k=>`<button data-cat="${esc(k)}" class="${actorCat===k?"on":""}">${esc(k)}</button>`).join("")}
    </div>
    <div id="mapstats" class="mono">${shown.length} actor(s) across ${D2.total_stories} stories · ${D2.from} → ${D2.to}${D2.state?" · "+D2.state:""} — click an actor to see its stories</div>
    ${shown.length?shown.map(actorCard).join(""):'<div class="empty">No tracked actors mentioned in this window.</div>'}
    ${co}`;
  $$("[data-days]").forEach(b=>b.onclick=()=>{actorDays=+b.dataset.days;actorOpen=null;renderActors()});
  $$("[data-cat]").forEach(b=>b.onclick=()=>{actorCat=b.dataset.cat;renderActors()});
  $$("[data-astate]").forEach(b=>b.onclick=()=>{stateFilterActor=b.dataset.astate;actorOpen=null;renderActors()});
  $$("[data-actor]").forEach(el=>el.onclick=ev=>{
    if(ev.target.tagName==="A")return;           // let story links open normally
    actorOpen=actorOpen===el.dataset.actor?null:el.dataset.actor; renderActors();
  });
}
let stateFilterActor="ALL";

// ---------- wiring ----------
$("#tabs").onclick=e=>{
  const a=e.target.closest("a[data-tab]"); if(!a)return; e.preventDefault();
  document.querySelectorAll("#tabs a").forEach(x=>x.classList.remove("active"));
  a.classList.add("active"); tab=a.dataset.tab; render();
};
$("#search").oninput=e=>{query=e.target.value;
  if(tab==="console"||tab==="stories"||tab==="sections")render();};
$("#dateSel").onchange=e=>load(e.target.value);
$("#runBtn").onclick=async()=>{
  $("#runBtn").disabled=true;$("#runmsg").textContent="Collecting + verifying…";
  await fetch("/api/run",{method:"POST"});
  const poll=setInterval(async()=>{
    const s=await (await fetch("/api/run/status")).json();
    if(!s.running){clearInterval(poll);$("#runBtn").disabled=false;
      $("#runmsg").textContent="";load()}
  },3000);
};
load();
</script>
</body>
