# NE India Security Intelligence Digest — configuration
# Window: YESTERDAY 07:00 IST -> TODAY 07:00 IST, computed at runtime.

window:
  timezone: "Asia/Kolkata"
  cutoff_hour: 7        # 07:00 IST daily boundary

# true  = trust each feed's own publish date; keep anything in the today/
#         yesterday window (no per-article re-fetch). Fetches ALL NE-state news,
#         normal or security. Inclusion gate = mentions a state/place in
#         `states:` below (edit that list to add/remove states).
# false = legacy: security-keyword relevance gate + two-pass date verification.
trust_feed_dates: true

# Auto-refresh: when serving, re-run collection every N minutes in the
# background (incremental — new stories are added, existing kept). 0 = off.
auto_refresh_minutes: 30

# Keep stories (and per-run logs) from the last N days; older rows are pruned
# at the start of each run so the database does not grow without bound.
# 0 = keep everything forever.
#
# 90 days = the history needed for trend / escalation analysis (comparing today
# against a rolling baseline). At ~900 stories/day this is ~80k rows — trivial
# for SQLite (a few tens of MB). The dashboard itself still shows only the
# today+yesterday window; this history is what makes "is this getting worse?"
# answerable. Do NOT lower this back to 7 unless you want that history deleted.
retain_days: 90

# Crawled/screenshot items (papers with no RSS feed) have no publish date.
# Stamp them with the collection time so they land in the today/yesterday
# window. Cap how many links to take per crawled site (across all its pages).
crawl_max_items: 40

# Location enrichment: for stories with no place in the headline/summary, fetch
# the article and look for the dateline ("IMPHAL, Aug 5:") / body location.
# Security sections are enriched first. Capped so a slow site cannot stall the
# 30-minute cycle; 0 disables enrichment entirely.
enrich_max_per_run: 60
enrich_days: 3

paths:
  db: "data/digest.db"
  json_out: "data/archive"   # fallback JSON per run

# One-line summaries. false = deterministic (RSS description, first sentence,
# stripped of HTML, max 160 chars; headline if no description). true = generate
# via a single batched claude-haiku-4-5 call per run (needs ANTHROPIC_API_KEY).
ai_summaries: false

# TIER 4 screenshot fallback (Playwright screenshot -> claude-haiku-4-5 vision).
# Max sites sent to the Claude API per run. Skipped if ANTHROPIC_API_KEY unset.
tier4_max_sites: 5

