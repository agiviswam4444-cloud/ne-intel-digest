   militant, insurgen, cadre, NSCN, ULFA, NDFB, PREPAK, KYKL, KCP, PLA, RPF,
   MNPF, HNLC, GNLA, NLFT, ATTF, KPLT, UPLA, ZRA, "Kuki", "Meitei", "Naga",
   encounter, ambush, IED, "gun battle", firing, killed, arrested, seized,
   surrender, ceasefire, "peace talk", AFSPA, OGW, "overground worker",
   BSF, CRPF, police, "para military", paramilitary, infiltrat, smuggl,
   narcotic, drugs, heroin, "brown sugar", yaba, trafficking, "arms cache",
   weapons, ammunition, LAC, China, PLA, Myanmar, "Chin National", KNA,
   refugee, border, fencing, Moreh, Zokhawthar, curfew, "internet suspension",
