       keywords: [army, "assam rifles", "territorial army", corps, brigade, battalion, "indian army", adgpi, jawan, soldier]}
  2:  {name: "CRPF / BSF / State Police",
       keywords: [crpf, bsf, police, commando, irb, "india reserve", ssb, itbp]}
  3:  {name: "Manipur Ethnic Conflict",
       keywords: [kuki, meitei, "zo people", churachandpur, "ethnic", "relief camp", "buffer zone", "displaced", imphal valley, kangpokpi]}
  4:  {name: "ULFA-I & Assam Insurgency",
       keywords: [ulfa, ndfb, kplt, upla, "adivasi", paresh, baruah, assam militant]}
  5:  {name: "NSCN & Nagaland Groups",
       keywords: [nscn, "naga flag", "framework agreement", muivah, "naga peace", nnpg, "eastern nagaland", enpo]}
  6:  {name: "Other Militant Groups",
       keywords: [prepak, kykl, kcp, "pla ", rpf, mnpf, hnlc, gnla, nlft, attf, zra, valley based, vbig, militant, insurgent, cadre, ogw]}
  7:  {name: "Myanmar Border",
       keywords: [myanmar, chin, sagaing, moreh, zokhawthar, "free movement", fmr, refugee, junta, tatmadaw, kna]}
  8:  {name: "China-LAC (Arunachal)",
       keywords: [china, lac, arunachal, tawang, "line of actual control", pla incursion, chinese]}
  9:  {name: "Bangladesh Border",
       keywords: [bangladesh, "cattle smuggl", "border haat", bgb, akhaura]}
  10: {name: "Narcotics & Trafficking",
       keywords: [drug, narcotic, heroin, yaba, "brown sugar", ganja, meth, trafficking, smuggl, "gold seiz", contraband]}
  11: {name: "Major Regional Headlines",
