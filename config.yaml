# Google News topic + site: queries for these regions. Topic queries catch
# defence news from ANY outlet; site: queries reach outlets that block us
# directly (Global Times, Irrawaddy, Dhaka Tribune, ISPR...).
foreign_queries:
  # ---- China ----
  - {state: CN, q: "PLA China military exercise OR drill OR incursion"}
  - {state: CN, q: "China defence ministry PLA Arunachal OR LAC OR Tibet"}
  - {state: CN, q: "China PLA Navy OR Air Force OR missile OR satellite deployment"}
  - {state: CN, q: "site:globaltimes.cn military OR PLA"}
  - {state: CN, q: "China Bhutan OR Nepal OR Myanmar border infrastructure military"}
  # ---- Bangladesh ----
  - {state: BD, q: "Bangladesh Army exercise OR procurement OR modernisation"}
  - {state: BD, q: "site:ispr.gov.bd"}
  - {state: BD, q: "site:dhakatribune.com army OR defence OR BGB"}
  - {state: BD, q: "Bangladesh BGB border India OR Myanmar security"}
  - {state: BD, q: "Bangladesh Navy OR Air Force China OR India defence deal"}
  # ---- Myanmar ----
  - {state: MM, q: "Myanmar military junta offensive OR airstrike OR ceasefire"}
  - {state: MM, q: "Myanmar Arakan Army OR TNLA OR MNDAA offensive"}
  - {state: MM, q: "site:irrawaddy.com"}
  - {state: MM, q: "Myanmar India border Chin State OR Sagaing security"}

# ------------------------------------------------------------------
# Public Telegram channels (t.me/s/<channel> — public HTML, no API key, no
# login, no account). Verified live before adding; each was checked for recent
# posts. Myanmar channels are the high-value ones: they post within hours and
# much of it never reaches their sites' RSS.
#
# NOT included on purpose: Assam Tribune and The News Mill run active channels
# but are already collected via RSS, so adding them would only duplicate.
# Channels found dead/stale when probed: northeastnow (last post 2025),
# mizoramnews (empty), mrtv_news (auto-deleting).
# CN/BD/MM entries still pass the defence filter below.
# ------------------------------------------------------------------
telegram_channels:
  - {name: "The Irrawaddy",  channel: theirrawaddy,  state: MM}
  - {name: "Mizzima Daily",  channel: mizzimadaily,  state: MM}
  - {name: "DVB TV News",    channel: dvbtvnews,     state: MM}
  - {name: "Khit Thit",      channel: khitthitnews,  state: MM}
  - {name: "RFA Burmese",    channel: rfaburmese,    state: MM}
  - {name: "BNI Online",     channel: bnionline,     state: MM}

# Defence-relevance gate for the three regions above ONLY (never applied to
# the NE states). A story must mention at least one of these to be kept.
defence_keywords:
  [pla, "people's liberation army", military, army, navy, naval, air force,
   defence, defense, troops, soldier, missile, warship, submarine, aircraft,
   fighter jet, drone, radar, satellite, nuclear, weapon, arms, artillery,
   exercise, drill, wargame, deployment, incursion, intrusion, border, lac,
   "line of actual control", pla navy, plaaf, mod, "ministry of defence",
   security, insurgent, militant, junta, tatmadaw, coup, offensive, airstrike,
   ceasefire, "arakan army", tnla, mndaa, "ethnic armed", bgb, "border guard",
   ispr, procurement, modernisation, modernization, "defence deal", geopolitic,
   strategic, intelligence, espionage, spy, sanction, "war ", conflict, clash,
   ccp, "communist party", xi jinping, taiwan, "south china sea", himalaya,
   # --- Burmese security vocabulary. REQUIRED: the Telegram channels post in
   # Burmese script, and without these 76 of 77 messages were being silently
   # dropped by the English-only list. Measured: these recover ~22%.
   "စစ်တပ်",        # military / army
   "စစ်ကောင်စီ",     # military council (junta)
   "တပ်မတော်",      # Tatmadaw
   "တပ်",           # troops
   "တိုက်ပွဲ",        # battle / fighting
   "ပစ်ခတ်",        # shooting / firing
   "လေကြောင်း",     # air (strike)
   "ဗုံး",           # bomb
   "လက်နက်",        # weapon
   "ဖမ်းဆီး",       # arrest / detain
   "သိမ်းပိုက်",      # seize / capture
   "အကြမ်းဖက်",     # terrorism
   "နယ်စပ်",        # border
   "စစ်ဘေး",        # war-displaced
   "ကာကွယ်ရေး",     # defence
   "လုံခြုံရေး",      # security
   # armed-group acronyms (written in Latin even in Burmese text)
   "KIA", "TNLA", "MNDAA", "PDF", "AA ", "KNU", "KNLA", "RCSS", "SSPP"]

# Topic discovery net — Google News keyword searches. This is the safety net
# that catches NE news carried by ANY outlet (national, obscure, or simply not
# in the list above): a story that is "in open source" but on a paper we don't
# track is still found here. Results are date-trusted, NE-scope-gated, and
# title-deduped against the papers above (the direct-outlet copy wins over the
# Google redirect link). Set to [] to disable.
discovery_queries:
  - Manipur
  - Assam
  - Nagaland
  - Meghalaya
  - Mizoram
  - Tripura
  - Arunachal Pradesh
  - Sikkim
  - Northeast India army security militant border drugs seized
  # Outlets that actively block automated access (Cloudflare bot challenge), so
  # they cannot be fetched directly. Read via the Google News aggregator index
  # rather than circumventing the site's own protection.
  - site:northeasttoday.in
  - site:thehansindia.com Northeast
  - site:prokerala.com Manipur OR Assam OR Nagaland
  # Outlets whose own servers refuse our connections (see the disabled paper
  # entries above) — reached through the aggregator index instead.
  - site:ifp.co.in
  - site:zozamtimes.in
  # Real outlets that cannot be read directly (under maintenance, e-paper-only,
  # or the domain no longer serves the paper) — kept in coverage via the index.
  - site:hueiyenlanpao.com
  - site:themizorampost.net
  - site:dailydesherkatha.net

# ------------------------------------------------------------------
# STEP 1D — X API v2 (created_at trusted as-is). Optional.
# ------------------------------------------------------------------
x_api:
  enabled: true
  bearer_token_file: "~/Documents/x_bearer_token.txt"
  handles:
    PIBGuwahati:     {state: MULTI, section: 2}
    manipur_police:  {state: MN,    section: 2}
    adgpi:           {state: MULTI, section: 1}
    assampolice:     {state: AS,    section: 2}
    assamrifles:     {state: MULTI, section: 1}
    HimantaBiswa:    {state: AS,    section: 11}
    nagalandpolice:  {state: NL,    section: 2}
    Mizoram_Police:  {state: MZ,    section: 2}

# ------------------------------------------------------------------
# Relevance gate — a story must match at least one keyword (any case)
